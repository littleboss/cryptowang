# Paper / dry-run smoke only.
# Packaging (uv) ≠ live trading. Green CI ≠ live.
# No secrets, no order / amend / withdraw HTTP. The official OKX SDK (python-okx) is
# installed from the lockfile but is reachable only through the GET-only facade in
# tools/okx_sdk_readonly.py; a step below asserts no okx.Trade / Funding / SubAccount
# import exists anywhere in the repo.
# local_paper_grid and grid_ab_compare run on a synthetic path here (no network).
# The only network step is a read-only GET of OKX *public* ticker/candles (no keys),
# isolated in its own job and non-blocking.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Least privilege: checkout the repo. Do not add Actions secrets.
permissions:
  contents: read

jobs:
  paper-smoke:
    name: Paper / dry-run smoke (no HTTP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      # Lockfile-only sync. Runtime deps: stdlib + pinned python-okx (gated read-only).
      # --no-dev skips ruff. Do not pip install anything else.
      - name: Sync project (paper runtime + gated read-only OKX SDK)
        run: uv sync --locked --no-dev

      # --no-dev: do not install ruff (or any other extra) for paper smoke.
      - name: Help — scripts start
        run: |
          uv run --locked --no-dev python tools/grid_fee_sensitivity.py --help
          uv run --locked --no-dev python tools/sl_guard_observe.py --help
          uv run --locked --no-dev python strategies/okx_grid_dry_run.py --help
          uv run --locked --no-dev python tools/local_paper_grid.py --help
          uv run --locked --no-dev python strategies/grid_ab_compare.py --help
          uv run --locked --no-dev python tools/okx_readonly_client.py --help
          uv run --locked --no-dev python strategies/paper_arb_scanner.py --help
          uv run --locked --no-dev python strategies/paper_combo_scanner.py --help
          uv run --locked --no-dev python strategies/paper_triangle_scanner.py --help
          uv run --locked --no-dev python tools/cost_engine.py --help
          uv run --locked --no-dev python strategies/paper_combo_expansion.py --help
          uv run --locked --no-dev python tools/okx_sdk_readonly.py --help

      # Official SDK is a read-only subset: only okx.MarketData / okx.Account / okx.Grid
      # may be imported anywhere in the repo (AST scan, not grep — docstrings mention
      # the forbidden names on purpose). The facade's own audit must pass too.
      - name: OKX SDK audit — no Trade / Funding / SubAccount import anywhere
        run: |
          set -euo pipefail
          uv run --locked --no-dev python -c "
          import pathlib, sys
          sys.path.insert(0, 'tools')
          import okx_sdk_readonly as sdk
          bad = {}
          for py in [*pathlib.Path('tools').rglob('*.py'), *pathlib.Path('strategies').rglob('*.py'),
                     *pathlib.Path('tests').rglob('*.py')]:
              extra = sdk.imported_sdk_modules(py) - sdk.ALLOWED_SDK_MODULES
              if extra:
                  bad[str(py)] = sorted(extra)
          assert not bad, f'forbidden okx imports: {bad}'
          sdk.assert_no_write_sdk_modules_loaded()
          assert not (set(sys.modules) & sdk.FORBIDDEN_SDK_MODULES)
          assert sdk.POLICY['will_send_http'] is False and sdk.POLICY['amend'] is False
          print('okx sdk audit ok: imported =', sorted(sdk.imported_sdk_modules()))
          "
          uv run --locked --no-dev python tools/okx_sdk_readonly.py policy

      # Synthetic path only (no network). Day-1 must not be stuck at 0 fills.
      - name: Local paper grid — synthetic fills > 0, venue=local_paper
        run: |
          set -euo pipefail
          uv run --locked --no-dev python tools/local_paper_grid.py --source synthetic \
            | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          m = doc['metrics']
          assert doc.get('venue') == 'local_paper', doc.get('venue')
          assert doc.get('will_send_http') is False, doc.get('will_send_http')
          assert doc['trading_http']['amend'] is False, doc['trading_http']
          assert doc['data_source']['http_fetch'] is False, doc['data_source']
          assert doc['params']['lever'] == 1, doc['params']
          assert m['buy_count'] > 0 and m['sell_count'] > 0 and m['arbitrage_num'] > 0, m
          assert abs((m['okx_bot_total_pnl'] - m['fees_paid_est']) - m['fee_after_pnl_est']) < 1e-4, m
          print('local_paper_grid: buy=%d sell=%d arb=%d fee_after=%.4f ok'
                % (m['buy_count'], m['sell_count'], m['arbitrage_num'], m['fee_after_pnl_est']))
          "

      # Strategy module: baseline vs B1 on the same synthetic path, both engines.
      # Nothing is adopted; will_send_http stays false; lever stays 1.
      - name: Grid A/B compare — proposal v3, baseline vs B1, synthetic path
        run: |
          set -euo pipefail
          for engine in import subprocess; do
            uv run --locked --no-dev python strategies/grid_ab_compare.py --engine "$engine" \
              --out "/tmp/cmp-$engine.json" --md-out "/tmp/cmp-$engine.md" --quiet
          done
          uv run --locked --no-dev python -c "
          import json
          a = json.load(open('/tmp/cmp-import.json'))
          b = json.load(open('/tmp/cmp-subprocess.json'))
          assert a['venue'] == 'local_paper' and a['will_send_http'] is False, a['venue']
          assert a['trading_http']['amend'] is False and a['trading_http']['order'] is False
          assert a['adoption']['adopted'] is False and a['adoption']['bot_changed'] is False
          assert set(a['arms']) == {'baseline', 'B1'}, set(a['arms'])
          for name, arm in a['arms'].items():
              assert arm['params']['lever'] == 1, (name, arm['params'])
              for k in ('fee_after_pnl_est', 'okx_bot_total_pnl_ratio', 'arbitrage_num',
                        'max_drawdown_ratio', 'fee_falsified', 'invalidation'):
                  assert k in arm, (name, k)
              assert arm['arbitrage_num'] > 0, (name, arm['arbitrage_num'])
              assert arm['candles'] == a['arms']['baseline']['candles'], 'arms must share the path'
          for name in a['arms']:
              for k in ('fee_after_pnl_est', 'arbitrage_num', 'max_drawdown_ratio'):
                  assert a['arms'][name][k] == b['arms'][name][k], ('engine mismatch', name, k)
          assert set(a['hypotheses']) == {'H-A', 'H-B', 'H-C'}, set(a['hypotheses'])
          assert a['hypotheses']['H-C']['add_position_proposals_allowed'] is False
          assert a['hypotheses']['H-C']['vetoed_arms'] == []
          print('grid_ab_compare: baseline vs B1 ok;', {n: (x['fee_after_pnl_est'], x['arbitrage_num'])
                                                       for n, x in a['arms'].items()})
          "
          cat /tmp/cmp-import.md

      # Private read-only path must stub cleanly with no keys (no Actions secrets exist here).
      - name: Read-only client — private-status stubs without keys (offline)
        run: |
          set -euo pipefail
          env -u OKX_API_KEY -u OKX_API_SECRET -u OKX_API_PASSPHRASE -u OKX_SIMULATED \
            uv run --locked --no-dev python tools/okx_readonly_client.py private-status \
            | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc['skipped'] is True, doc
          assert doc['policy']['will_send_http'] is False, doc['policy']
          assert doc['policy']['order'] is False and doc['policy']['amend'] is False
          assert doc['policy']['withdraw'] is False and doc['policy']['transfer'] is False
          print('okx_readonly_client: private-status skipped without keys ok')
          "
          uv run --locked --no-dev python tools/okx_readonly_client.py policy

      # Same contract on the SDK backend: must stub without keys, must refuse live keys.
      - name: SDK facade — private-status stubs without keys, refuses live keys (offline)
        run: |
          set -euo pipefail
          env -u OKX_API_KEY -u OKX_API_SECRET -u OKX_API_PASSPHRASE -u OKX_SIMULATED \
            uv run --locked --no-dev python tools/okx_sdk_readonly.py private-status \
            | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc['skipped'] is True, doc
          assert doc['policy']['will_send_http'] is False, doc['policy']
          assert doc['policy']['order'] is False and doc['policy']['amend'] is False
          assert doc['policy']['withdraw'] is False and doc['policy']['transfer'] is False
          print('okx_sdk_readonly: private-status skipped without keys ok')
          "
          # Placeholder (non-secret) live-style keys without OKX_SIMULATED=1 must exit 3.
          set +e
          OKX_API_KEY=ci-placeholder OKX_API_SECRET=ci-placeholder OKX_API_PASSPHRASE=ci-placeholder \
            uv run --locked --no-dev python tools/okx_sdk_readonly.py private-status > /tmp/live.json
          rc=$?
          set -e
          test "$rc" -eq 3 || { echo "expected exit 3 for live keys, got $rc"; cat /tmp/live.json; exit 1; }
          ! grep -q ci-placeholder /tmp/live.json
          echo 'okx_sdk_readonly: live keys refused (exit 3), nothing echoed ok'

      # Cost Engine v0 (roadmap P0, Phase C paper/read-only): replay the JSON case fixture.
      # Numbers must reproduce; the refusal cases (annualised gross, mark price as executable,
      # buy-at-bid, one-sided book, calibrated claim without reference) must be refused.
      # Everything offline, no keys; calibrated stays false; no tradable claim.
      - name: Cost engine — fixture cases replay, observe_only, uncalibrated
        run: |
          set -euo pipefail
          uv run --locked --no-dev python tools/cost_engine.py --out /tmp/cost-cases.json --full
          uv run --locked --no-dev python -c "
          import json
          rep = json.load(open('/tmp/cost-cases.json'))
          assert rep['all_ok'] is True, [c['id'] for c in rep['cases'] if not c['ok']]
          assert rep['action'] == 'observe_only' and rep['will_send_http'] is False
          assert all(v is False for v in rep['trading_http'].values()), rep['trading_http']
          assert rep['data_source']['http_fetch'] is False
          assert rep['calibrated'] is False and rep['tradable_claim_allowed'] is False
          refused = {c['id']: c['refused'] for c in rep['cases'] if c.get('refused')}
          assert refused['refused_annualized_gross'] == 'NaiveAnnualizationRefused', refused
          assert refused['refused_mark_price_as_executable'] == 'ExecutablePriceViolation', refused
          assert refused['refused_calibrated_claim_without_ref'] == 'CalibrationClaimRefused', refused
          core = ('fees', 'half_spread_slip', 'impact', 'borrow', 'transfer', 'capital_opp',
                  'funding_uncertainty', 'hedge_rebalance')
          for c in rep['cases']:
              r = c.get('result')
              if not r:
                  continue
              assert r['action'] == 'observe_only' and r['will_send_http'] is False, c['id']
              assert r['annualized'] is False and r['edge_basis'] == 'hold_horizon', c['id']
              assert r['tradable_claim_allowed'] is False, c['id']
              assert all(k in r['components_bps'] for k in core), c['id']
              assert abs(r['all_in_cost_bps'] - round(sum(r['components_bps'].values()), 4)) < 1e-6, c['id']
              assert abs(r['net_edge_bps'] - round(r['gross_edge_bps'] - r['all_in_cost_bps'], 4)) < 1e-6, c['id']
              be = r['breakeven_funding']
              if be.get('rate_per_interval') is not None:
                  assert abs(be['headroom_bps_per_interval'] * be['intervals'] - r['net_edge_bps']) < 1e-2, c['id']
          a1 = next(c['result'] for c in rep['cases'] if c['id'] == 'a1_like_positive_carry_buckets')
          print('cost_engine: %d/%d cases ok; a1 all_in=%.4f net=%.4f breakeven=%.6f/interval'
                % (rep['cases_ok'], rep['cases_total'], a1['all_in_cost_bps'], a1['net_edge_bps'],
                   a1['breakeven_funding_rate']))
          "

      # Paper multi-leg arb scanner (Phase A) on the synthetic books fixture: offline, no keys.
      # Every record must be observe_only / will_send_http=false with bid/ask-only legs.
      # A synthetic "edge" in the fixture is a code-path check, not market evidence.
      # The Cost Engine v0 block must reproduce costs_bps.total on every record (A1 with breakeven).
      - name: Paper arb scanner — fixture replay, observe_only, bid/ask only
        run: |
          set -euo pipefail
          uv run --locked --no-dev python strategies/paper_arb_scanner.py --source fixture \
            --paper-fills --out /tmp/arb.jsonl --summary-out /tmp/arb-summary.json --quiet
          uv run --locked --no-dev python -c "
          import json
          rows = [json.loads(l) for l in open('/tmp/arb.jsonl') if l.strip()]
          s = json.load(open('/tmp/arb-summary.json'))
          assert rows, 'no records'
          fams = set()
          for r in rows:
              assert r['action'] == 'observe_only', r['action']
              assert r['will_send_http'] is False, r['will_send_http']
              assert r['paper_fill']['order_sent'] is False
              assert 'total' in r['costs_bps'] and isinstance(r['risk_flags'], list)
              ce = r['cost_engine']
              assert ce['action'] == 'observe_only' and ce['will_send_http'] is False, ce
              assert ce['calibrated'] is False and ce['tradable_claim_allowed'] is False, ce
              assert abs(ce['all_in_cost_bps'] - r['costs_bps']['total']) < 1e-6, (ce['all_in_cost_bps'], r['costs_bps'])
              assert abs(ce['net_edge_bps'] - r['net_edge_bps']) < 1e-6
              assert (ce['breakeven_funding_rate'] is not None) == (r['family'] == 'A1_funding_carry'), r['family']
              for leg in r['legs']:
                  assert leg['price_type'] in ('bid', 'ask'), leg
                  assert leg['price_type'] == ('ask' if leg['side'] == 'buy' else 'bid'), leg
              if r['family'] == 'A1_funding_carry':
                  assert r['taxonomy'] == 'relative_value', r['taxonomy']
              else:
                  assert r['taxonomy'].startswith('identity_approx'), r['taxonomy']
              if r['family'] == 'A3_box' and r['direction'] == 'sell_box':
                  assert r['passes_threshold'] is False, 'short box must never pass'
              fams.add(r['family'])
          assert fams == {'A1_funding_carry', 'A2_pcp_conversion', 'A2_pcp_reversal', 'A3_box'}, fams
          assert s['action'] == 'observe_only' and s['will_send_http'] is False
          assert all(v is False for v in s['trading_http'].values()), s['trading_http']
          assert s['config']['safety_buffer']['calibrated'] is False
          assert s['config']['leverage_concept'] == 1
          assert s['cost_engine']['enabled'] is True and s['cost_engine']['calibrated'] is False
          assert s['cost_engine']['records'] == len(rows) and s['cost_engine']['records_with_breakeven'] == s['snapshots']
          assert set(s['hypotheses']) == {'H-A1', 'H-A2', 'H-A3'}, set(s['hypotheses'])
          assert s['data_source']['http_fetch'] is False
          print('paper_arb_scanner: %d records / %d snapshots ok;' % (len(rows), s['snapshots']),
                {f: (v['records'], v['edge_exceeds_buffer'], v['passes_threshold'])
                 for f, v in s['families'].items()},
                'cost_engine median breakeven bp/interval:', s['cost_engine']['median_breakeven_funding_bps_per_interval'])
          "

      # Paper combo scanner (Phase B) on the synthetic two-expiry fixture: offline, no keys.
      # Every record must be observe_only / will_send_http=false / phase=B / relative_value with
      # combo_id + hedge_mode + residual_risks, bid/ask-only legs, covered short options and a
      # paper-only delta simulation (live_hedge_http=false). Fixture dislocations are synthetic
      # code-path checks, not market evidence.
      - name: Paper combo scanner — fixture replay, observe_only, relative_value, no live hedge
        run: |
          set -euo pipefail
          uv run --locked --no-dev python strategies/paper_combo_scanner.py --source fixture \
            --paper-fills --out /tmp/combo.jsonl --summary-out /tmp/combo-summary.json --quiet
          uv run --locked --no-dev python -c "
          import json
          rows = [json.loads(l) for l in open('/tmp/combo.jsonl') if l.strip()]
          s = json.load(open('/tmp/combo-summary.json'))
          assert rows, 'no records'
          need_rr = {'B1_covered_call_carry': {'gamma', 'funding_flip', 'gap', 'margin', 'basis', 'capped_upside'},
                     'B2_calendar_vol': {'gamma', 'vega_term_structure', 'gap', 'margin',
                                         'hedge_slippage_underestimation', 'model_risk'},
                     'B3_put_skew_rr': {'skew_trend', 'gamma', 'gap', 'margin', 'spot_direction_bleed', 'liquidity'}}
          modes = {'B1_covered_call_carry': {'static_combo'}, 'B2_calendar_vol': {'paper_delta_sim_only'},
                   'B3_put_skew_rr': {'options_rr_static', 'options_rr_plus_paper_delta'}}
          fams = set()
          for r in rows:
              assert r['action'] == 'observe_only', r['action']
              assert r['will_send_http'] is False, r['will_send_http']
              assert r['phase'] == 'B' and r['taxonomy'] == 'relative_value', (r['phase'], r['taxonomy'])
              assert r['combo_id'] == r['family'][:2], (r['combo_id'], r['family'])
              assert r['hedge_mode'] in modes[r['family']], r['hedge_mode']
              assert need_rr[r['family']] <= set(r['residual_risks']), r['residual_risks']
              assert 'relative_value_not_riskless' in r['risk_flags']
              assert 'vol_path_haircut' in r['costs_bps'] and 'total' in r['costs_bps']
              assert 'vol_path_haircut_bps' in r['safety_buffer']['components']
              ce = r['cost_engine']
              assert ce['action'] == 'observe_only' and ce['will_send_http'] is False, ce
              assert ce['calibrated'] is False and ce['tradable_claim_allowed'] is False, ce
              assert abs(ce['all_in_cost_bps'] - r['costs_bps']['total']) < 1e-6, (ce['all_in_cost_bps'], r['costs_bps'])
              assert 'vol_path_haircut' in ce['components_bps'], ce['components_bps']
              assert (ce['breakeven_funding_rate'] is not None) == (r['family'] == 'B1_covered_call_carry'), r['family']
              assert r['paper_delta_sim']['live_hedge_http'] is False and r['paper_delta_sim']['order_sent'] is False
              assert r['paper_fill']['order_sent'] is False
              assert r['leverage_concept'] == 1
              for leg in r['legs']:
                  assert leg['price_type'] in ('bid', 'ask'), leg
                  assert leg['price_type'] == ('ask' if leg['side'] == 'buy' else 'bid'), leg
              shorts = [l for l in r['legs'] if l['role'] in ('call', 'put') and l['side'] == 'sell']
              assert len(r['cover']) == len(shorts), 'every short option must have a cover entry'
              if r['family'] == 'B2_calendar_vol':
                  assert r['paper_delta_sim']['enabled'] is True
              text = json.dumps(r, ensure_ascii=False).lower()
              for bad in ('risk_free', '无风险', '稳赚', 'guaranteed'):
                  assert bad not in text, bad
              fams.add(r['family'])
          assert fams == {'B1_covered_call_carry', 'B2_calendar_vol', 'B3_put_skew_rr'}, fams
          assert s['action'] == 'observe_only' and s['will_send_http'] is False and s['phase'] == 'B'
          assert s['live_delta_hedge'] is False
          assert all(v is False for v in s['trading_http'].values()), s['trading_http']
          assert s['config']['safety_buffer']['calibrated'] is False
          assert s['config']['leverage_concept'] == 1
          assert s['config']['b2']['live_delta_hedge'] is False
          assert set(s['hypotheses']) == {'H-B1', 'H-B2', 'H-B3'}, set(s['hypotheses'])
          assert s['a1_reference_same_window']['records'] == s['snapshots']
          assert s['cost_engine']['enabled'] is True and s['cost_engine']['calibrated'] is False
          assert s['cost_engine']['records'] == len(rows)
          assert s['data_source']['http_fetch'] is False
          assert s['mainline_unchanged'] == 'spot_grid_local_paper'
          print('paper_combo_scanner: %d records / %d snapshots ok;' % (len(rows), s['snapshots']),
                {f: (v['records'], v['edge_exceeds_buffer'], v['passes_threshold'])
                 for f, v in s['families'].items()})
          "

      # Paper spot triangle scanner (menu T1) on the synthetic ETH/BTC/USDT fixture: offline, no
      # keys. Every record must be observe_only / will_send_http=false / same_venue_microstructure
      # (never risk_free) with three bid/ask-only spot legs on the 04-risk whitelist, mandatory
      # residual_risks (non-atomic three-leg), a book_sync block (skew > 200 ms → stale_book, never
      # passes), a per-leg half-spread cap (15 bp → illiquid) and gross / net / costs taken verbatim
      # from the cost_engine block. Fixture dislocations are synthetic code-path checks, not evidence.
      # Stale-fix v1 (03-proposals / 04-risk 2026-09-18 t1-stale-fix-reread-v1): the sync gate stays
      # strict at 200 ms (no relaxed mode exists); skew is lowered by *how* books are fetched
      # (--fetch-mode parallel, --sync-retries) and every summary splits full sample vs the
      # !stale_book subset (sync_report). Paper only: nothing here can send an order.
      - name: Paper triangle scanner (T1) — fixture replay, observe_only, cost_engine is the edge
        run: |
          set -euo pipefail
          uv run --locked --no-dev python strategies/paper_triangle_scanner.py --source fixture \
            --out /tmp/t1.jsonl --summary-out /tmp/t1-summary.json --quiet
          uv run --locked --no-dev python strategies/paper_triangle_scanner.py --help > /tmp/t1-help.txt
          grep -q -- '--fetch-mode' /tmp/t1-help.txt && grep -q -- '--sync-retries' /tmp/t1-help.txt
          uv run --locked --no-dev python -c "
          import json
          rows = [json.loads(l) for l in open('/tmp/t1.jsonl') if l.strip()]
          s = json.load(open('/tmp/t1-summary.json'))
          assert rows, 'no records'
          need_rr = {'non_atomic_three_leg', 'leftover_inventory_on_partial_or_cancelled_leg'}
          legs_ok = {'ETH-USDT', 'BTC-USDT', 'ETH-BTC'}
          for r in rows:
              assert r['action'] == 'observe_only', r['action']
              assert r['will_send_http'] is False, r['will_send_http']
              assert r['menu_id'] == 'T1' and r['taxonomy'] == 'same_venue_microstructure', r['taxonomy']
              assert set(r['instruments']) == legs_ok, r['instruments']
              assert len(r['legs']) == 3 and r['leverage_concept'] == 1
              assert need_rr <= set(r['residual_risks']), r['residual_risks']
              assert 'non_atomic_three_leg' in r['risk_flags']
              for leg in r['legs']:
                  assert leg['price_type'] in ('bid', 'ask'), leg
                  assert leg['price_type'] == ('ask' if leg['side'] == 'buy' else 'bid'), leg
              ce = r['cost_engine']
              assert ce['action'] == 'observe_only' and ce['will_send_http'] is False, ce
              assert ce['calibrated'] is False and ce['tradable_claim_allowed'] is False, ce
              assert r['net_edge_bps'] == ce['net_edge_bps'] and r['gross_edge_bps'] == ce['gross_edge_bps']
              assert r['costs_bps']['total'] == ce['all_in_cost_bps']
              assert r['costs_bps']['fees'] > 0 and r['costs_bps']['half_spread_slip'] > 0, r['costs_bps']
              assert r['book_sync']['max_skew_ms'] == 200 and r['liquidity']['max_half_spread_bps'] == 15.0
              assert r['book_sync']['sync_gate'] == 'strict', r['book_sync']
              assert r['book_sync']['fetch'] is None, 'fixture snapshots carry no fetch block'
              if 'stale_book' in r['risk_flags'] or 'illiquid' in r['risk_flags']:
                  assert r['passes_threshold'] is False, 'stale / illiquid can never pass'
              assert r['synthetic_fill']['order_sent'] is False
              text = json.dumps(r, ensure_ascii=False).lower()
              for bad in ('risk_free', '无风险', '稳赚', 'guaranteed'):
                  assert bad not in text, bad
          assert {r['direction'] for r in rows} == {'usdt_eth_btc_usdt', 'usdt_btc_eth_usdt'}
          m = s['metrics']
          assert s['action'] == 'observe_only' and s['will_send_http'] is False and s['menu_id'] == 'T1'
          assert all(v is False for v in s['trading_http'].values()), s['trading_http']
          assert s['config']['safety_buffer']['calibrated'] is False and s['config']['leverage_concept'] == 1
          assert s['config']['max_book_skew_ms'] == 200 and s['config']['max_half_spread_bps'] == 15.0
          assert s['cost_engine']['records'] == len(rows) and s['cost_engine']['calibrated'] is False
          assert m['stale_book'] > 0 and m['illiquid'] > 0 and m['cost_killed'] > 0, m
          for k in ('net_positive_rate', 'cost_kill_rate', 'synthetic_fill_success_rate'):
              assert m[k] is not None, k
          assert 'H-T1' in s['hypotheses'] and s['data_source']['http_fetch'] is False
          assert s['mainline_unchanged'] == 'spot_grid_local_paper'
          # stale-fix v1: strict gate labelled, split report present and internally consistent
          sr = s['sync_report']
          assert sr['sync_gate'] == 'strict' and sr['gate_unchanged'] is True and sr['max_skew_ms'] == 200, sr
          assert sr['fetch_mode'] is None, 'fixture source has no fetch block'
          assert sr['subsets']['all'] == m, 'subsets.all must be the full-sample metrics'
          assert sr['subsets']['synced']['records'] + sr['subsets']['stale_or_missing']['records'] == sr['records']
          assert sr['subsets']['synced']['stale_book'] == 0 and sr['subsets']['stale_or_missing']['passes_threshold'] == 0
          assert sr['stale_book'] == m['stale_book'] and sr['synced'] + sr['stale_book'] + sr['book_timestamp_missing'] == sr['records']
          assert sr['skew_ms']['within_gate'] == sr['synced'], sr['skew_ms']
          assert 'synced_subset' in s['hypotheses']['H-T1']
          assert 'relaxed' not in json.dumps(s, ensure_ascii=False).lower(), 'no relaxed sync gate may appear'
          print('paper_triangle_scanner: %d records / %d snapshots ok; net>0 rate=%s cost_kill_rate=%s '
                'synthetic_fill=%s stale=%d illiquid=%d pass=%d'
                % (len(rows), s['snapshots'], m['net_positive_rate'], m['cost_kill_rate'],
                   m['synthetic_fill_success_rate'], m['stale_book'], m['illiquid'], m['passes_threshold']))
          print('sync_report: gate=%s/%dms stale_rate=%s synced_rate=%s skew(median/p90/max)=%s/%s/%s; '
                'synced subset net>0 rate=%s pass=%d'
                % (sr['sync_gate'], sr['max_skew_ms'], sr['stale_book_rate'], sr['synced_rate'],
                   sr['skew_ms']['median'], sr['skew_ms']['p90'], sr['skew_ms']['max'],
                   sr['subsets']['synced']['net_positive_rate'], sr['subsets']['synced']['passes_threshold']))
          "

      # Combo expansion C1–C4 (paper / read-only side branch, 04-risk conditional pass) on the
      # synthetic expansion fixture: offline, no keys. Every record must be observe_only /
      # will_send_http=false / phase=C / relative_value with a C1–C4 combo_id, ≤2 tradeable legs
      # for C1/C2 (far month + perp only as hedge_note), bid/ask-only legs, a mandatory
      # cost_engine block that *is* the record's gross/all-in/net edge, calibrated=false, stub
      # models labelled, illiquid legs never passing, coverage N≥5 before any verdict wording.
      # Fixture dislocations are synthetic code-path checks, not market evidence.
      - name: Paper combo expansion — fixture replay, C1–C4, cost_engine mandatory, no live
        run: |
          set -euo pipefail
          uv run --locked --no-dev python strategies/paper_combo_expansion.py evaluate-fixture \
            --paper-fills --out /tmp/exp.jsonl --summary-out /tmp/exp-summary.json --quiet
          uv run --locked --no-dev python strategies/paper_combo_expansion.py policy \
            | uv run --locked --no-dev python -c "
          import json, sys
          pol = json.load(sys.stdin)
          assert pol['will_send_http'] is False and pol['live_execution'] is False, pol
          assert all(v is False for v in pol['trading_http'].values()), pol['trading_http']
          assert pol['leverage_concept_max'] == 1 and pol['taxonomy'] == 'relative_value'
          assert pol['C4']['max_half_spread_bps'] == 25.0 and pol['C3']['coverage_gate_n'] == 5
          print('paper_combo_expansion policy ok')
          "
          uv run --locked --no-dev python -c "
          import json
          rows = [json.loads(l) for l in open('/tmp/exp.jsonl') if l.strip()]
          s = json.load(open('/tmp/exp-summary.json'))
          assert rows, 'no records'
          exps = set()
          for r in rows:
              assert r['action'] == 'observe_only', r['action']
              assert r['will_send_http'] is False, r['will_send_http']
              assert r['phase'] == 'C' and r['taxonomy'] == 'relative_value', (r['phase'], r['taxonomy'])
              assert r['expansion_id'] in ('C1', 'C2', 'C3', 'C4') and r['combo_id'].startswith(r['expansion_id'])
              assert r['calibrated'] is False and r['leverage_concept'] == 1
              assert r['net_edge_source'] == 'tools/cost_engine.py:evaluate'
              assert 'relative_value_not_riskless' in r['risk_flags'] and r['residual_risks']
              ce = r['cost_engine']
              assert ce['action'] == 'observe_only' and ce['will_send_http'] is False, ce
              assert ce['calibrated'] is False and ce['tradable_claim_allowed'] is False and ce['annualized'] is False, ce
              assert abs(ce['all_in_cost_bps'] - r['costs_bps']['total']) < 1e-6, (ce['all_in_cost_bps'], r['costs_bps'])
              assert abs(ce['net_edge_bps'] - r['net_edge_bps']) < 1e-6 and abs(ce['gross_edge_bps'] - r['gross_edge_bps']) < 1e-6
              for leg in r['legs']:
                  assert leg['price_type'] in ('bid', 'ask'), leg
                  assert leg['price_type'] == ('ask' if leg['side'] == 'buy' else 'bid'), leg
              if r['expansion_id'] in ('C1', 'C2'):
                  assert len(r['legs']) <= 2 and r['model'] == 'stub', (len(r['legs']), r['model'])
                  assert all(h['tradeable_default'] is False for h in r['hedge_note'])
              if r['expansion_id'] == 'C1':
                  assert r['fair_value']['model'] == 'stub' and r['fair_value']['used_in_net_edge'] is False
              if r['expansion_id'] == 'C2':
                  assert r['funding_model']['annualized_used_in_net_edge'] is False
                  assert ce['breakeven_funding_rate'] is not None
                  if r['basis_confirmation']['conflict']:
                      assert 'basis_conflict_with_funding_expectation' in r['invalidated_by']
              if r['expansion_id'] == 'C3':
                  assert r['base_family'] in ('B1_covered_call_carry', 'B3_put_skew_rr'), r['base_family']
                  shorts = [l for l in r['legs'] if l['role'] in ('call', 'put') and l['side'] == 'sell']
                  assert len(r['cover']) == len(shorts), 'every short option must have a cover entry'
              if r['expansion_id'] == 'C4':
                  assert r['base_family'].startswith(('A2_', 'A3_')) and r['taxonomy_base'] == 'identity_approx'
                  assert len(r['legs']) <= 4
              if not r['liquidity_ok']:
                  assert r['passes_threshold'] is False and 'c4_illiquid_leg' in r['invalidated_by']
              assert r['paper_fill']['order_sent'] is False
              text = json.dumps(r, ensure_ascii=False).lower()
              for bad in ('risk_free', '无风险', '稳赚', 'guaranteed'):
                  assert bad not in text, bad
              exps.add(r['expansion_id'])
          assert exps == {'C1', 'C2', 'C3', 'C4'}, exps
          assert s['action'] == 'observe_only' and s['will_send_http'] is False and s['phase'] == 'C'
          assert s['live_execution'] is False and s['live_delta_hedge'] is False
          assert all(v is False for v in s['trading_http'].values()), s['trading_http']
          assert s['underlying'] == 'ETH' and s['config']['allow_btc'] is False
          assert s['config']['safety_buffer']['calibrated'] is False and s['config']['leverage_concept'] == 1
          assert s['cost_engine']['mandatory'] is True and s['cost_engine']['records'] == len(rows)
          fm = s['falsifiable_metrics']
          for k in ('net_edge_bps_gt_0_rate', 'cost_kill_rate', 'sample_coverage_B1', 'sample_coverage_B3'):
              assert k in fm, k
          assert fm['calibrated'] is False and fm['tradable_claim_allowed'] is False
          assert fm['sample_coverage_B1']['baseline_n_phase_b_defaults'] == 0 and fm['sample_coverage_B1']['n'] >= 5
          for cov in (fm['sample_coverage_B1'], fm['sample_coverage_B3']):
              assert cov['verdict'] in ('coverage_insufficient_no_verdict', 'cost_veto_on_window',
                                        'net_positive_observed_uncalibrated_not_tradable'), cov
          assert set(s['hypotheses']) == {'H-C1', 'H-C2', 'H-C3', 'H-C4'}, set(s['hypotheses'])
          assert s['expansions']['C3']['mechanism']['mechanism'] == 'delta_moneyness_band_plus_5pp_symmetric'
          assert s['expansions']['C4']['illiquid_flagged'] > 0
          assert s['data_source']['http_fetch'] is False
          assert s['mainline_unchanged'] == 'spot_grid_local_paper'
          print('paper_combo_expansion: %d records / %d snapshots ok;' % (len(rows), s['snapshots']),
                {e: (v['records'], v['net_gt_0'], v['liquidity_ok'], v['passes_threshold']) for e, v in s['expansions'].items()},
                'net>0 rate', fm['net_edge_bps_gt_0_rate'], 'B1 coverage', fm['sample_coverage_B1']['n'], fm['sample_coverage_B1']['verdict'])
          "

      - name: Unit tests (stdlib unittest, no network)
        run: uv run --locked --no-dev python -m unittest discover -s tests -v

      - name: Default run — paper / PRINT_ONLY
        run: |
          set -euo pipefail
          uv run --locked --no-dev python tools/grid_fee_sensitivity.py | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc.get('mode') == 'paper', doc
          print('grid_fee_sensitivity: paper ok')
          "
          uv run --locked --no-dev python tools/sl_guard_observe.py | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc.get('mode') == 'paper_observe', doc
          print('sl_guard_observe: paper_observe ok')
          "
          uv run --locked --no-dev python strategies/okx_grid_dry_run.py | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc.get('will_send_http') is False, doc
          assert doc.get('method') == 'PRINT_ONLY', doc
          print('okx_grid_dry_run: will_send_http=false PRINT_ONLY ok')
          "

  # Read-only *public* market GET (ticker + candles). No keys, no secrets, no trade endpoints.
  # Separate job so a network hiccup / regional block cannot fail the offline paper gate.
  # This is informational: a red here means "OKX public API unreachable from the runner",
  # never "trading happened".
  public-read-smoke:
    name: OKX public read-only GET smoke (no keys, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync project (paper runtime + gated read-only OKX SDK)
        run: uv sync --locked --no-dev

      - name: Public ticker + candles (GET only)
        env:
          # Belt and braces: make sure nothing private can activate even by accident.
          OKX_API_KEY: ""
          OKX_API_SECRET: ""
          OKX_API_PASSPHRASE: ""
          OKX_SIMULATED: ""
        run: |
          set -euo pipefail
          uv run --locked --no-dev python tools/okx_readonly_client.py ticker --inst-id ETH-USDT \
            | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc['policy']['will_send_http'] is False, doc['policy']
          assert doc['ticker']['instId'] == 'ETH-USDT' and doc['ticker']['last'] > 0, doc['ticker']
          print('public ticker ok: last=%s' % doc['ticker']['last'])
          "
          uv run --locked --no-dev python tools/okx_readonly_client.py candles --inst-id ETH-USDT \
              --bar 5m --limit 12 --pages 1 --csv-out /tmp/eth-5m.csv \
            | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc['data_source']['auth'] == 'none' and doc['data_source']['read_only'] is True
          assert doc['count'] > 0, doc['count']
          ts = [c['ts_ms'] for c in doc['candles']]
          assert ts == sorted(ts), 'candles must be oldest→newest'
          print('public candles ok: %d rows' % doc['count'])
          "
          # Same public candles through the strategy module via CSV replay (offline after fetch).
          uv run --locked --no-dev python strategies/grid_ab_compare.py --source csv \
            --candles-csv /tmp/eth-5m.csv --quiet --print-md

      # Same two public GETs through the official SDK facade. Still no keys; the facade
      # refuses anything but allow-listed GETs before a socket opens.
      - name: Public ticker + candles via python-okx facade (GET only)
        env:
          OKX_API_KEY: ""
          OKX_API_SECRET: ""
          OKX_API_PASSPHRASE: ""
          OKX_SIMULATED: ""
        run: |
          set -euo pipefail
          uv run --locked --no-dev python tools/okx_sdk_readonly.py ticker --inst-id ETH-USDT \
            | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc['policy']['will_send_http'] is False, doc['policy']
          assert 'python-okx' in doc['policy']['backend'], doc['policy']
          assert doc['ticker']['instId'] == 'ETH-USDT' and doc['ticker']['last'] > 0, doc['ticker']
          print('sdk public ticker ok: last=%s' % doc['ticker']['last'])
          "
          uv run --locked --no-dev python tools/okx_sdk_readonly.py candles --inst-id ETH-USDT \
              --bar 5m --limit 12 --pages 1 --csv-out /tmp/eth-5m-sdk.csv \
            | uv run --locked --no-dev python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc['data_source']['auth'] == 'none' and doc['data_source']['read_only'] is True
          assert doc['count'] > 0, doc['count']
          ts = [c['ts_ms'] for c in doc['candles']]
          assert ts == sorted(ts), 'candles must be oldest→newest'
          print('sdk public candles ok: %d rows' % doc['count'])
          "
