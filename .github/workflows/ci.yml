# Paper / dry-run smoke only.
# Packaging (uv) ≠ live trading. Green CI ≠ live.
# No secrets, no trading/HTTP client installs, no HTTP / amend / withdraw.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Least privilege: checkout the repo. Do not add Actions secrets.
permissions:
  contents: read

jobs:
  paper-smoke:
    name: Paper / dry-run smoke (no HTTP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      # Lockfile-only sync. Runtime deps are empty (stdlib).
      # --no-dev skips ruff. Do not pip install trading stacks.
      - name: Sync project (paper runtime, no trading clients)
        run: uv sync --locked --no-dev

      - name: Help — scripts start
        run: |
          uv run python tools/grid_fee_sensitivity.py --help
          uv run python tools/sl_guard_observe.py --help
          uv run python strategies/okx_grid_dry_run.py --help

      - name: Default run — paper / PRINT_ONLY
        run: |
          set -euo pipefail
          uv run python tools/grid_fee_sensitivity.py | uv run python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc.get('mode') == 'paper', doc
          print('grid_fee_sensitivity: paper ok')
          "
          uv run python tools/sl_guard_observe.py | uv run python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc.get('mode') == 'paper_observe', doc
          print('sl_guard_observe: paper_observe ok')
          "
          uv run python strategies/okx_grid_dry_run.py | uv run python -c "
          import json, sys
          doc = json.load(sys.stdin)
          assert doc.get('will_send_http') is False, doc
          assert doc.get('method') == 'PRINT_ONLY', doc
          print('okx_grid_dry_run: will_send_http=false PRINT_ONLY ok')
          "
